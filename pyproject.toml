[project]
name = "cmp"
version = "0.1.0"
description = "Coherent Markets — research into semantic, logical, and cross-market incoherence in prediction markets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  "anthropic>=0.40",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pyright>=1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
