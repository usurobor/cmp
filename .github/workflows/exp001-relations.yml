# CMP relation discovery — RETIRED.
#
# This workflow ran scripts/gen_candidate_pairs.py, which materialises the full
# pairwise candidate map in RAM. On the 2 GB / 1 vCPU box it does not OOM (the
# cgroup cap holds) but throttles into near-uselessness: one run sat 2h10m at
# ~22% CPU with 715k reclaim events, holding ~1.2 GB and starving the single
# core that the embedding encode needs.
#
# The pilot moved to the SAMPLED, memory-bounded path (build_review_batch.py)
# and the embedding slice (embed_and_retrieve.py) supersedes mechanical pairwise
# generation. This workflow is kept only as a disabled record.
#
# Auto-trigger removed so an edit to this file or the script can no longer spawn
# the throttling job. Dispatch-only, and the heavy step is a no-op.
name: exp001-relations

on:
  workflow_dispatch:

concurrency:
  group: exp001-relations
  cancel-in-progress: false

jobs:
  relations:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "exp001-relations is retired. gen_candidate_pairs.py starves the"
          echo "single-core box; use the sampled path (build_review_batch.py) or"
          echo "the embedding slice (embed_and_retrieve.py) instead."
          exit 1
